<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" width="600" height="620" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>fytiaolivier</title>
  <rect width="600" height="620" rx="40" fill="#0A0A0A"/>

  <!-- Hexagone : serveur / réseau -->
  <polygon points="300,50 490,160 490,380 300,490 110,380 110,160" fill="#000000" stroke="#1E90FF" stroke-width="10" stroke-linejoin="round"/>
  <polygon points="300,72 471,171 471,369 300,468 129,369 129,171" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>

  <g transform="translate(-15,0)">
    <!-- Lettre F dessinée comme une topologie réseau -->
    <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none">
      <line x1="235" y1="170" x2="235" y2="410"/>
      <line x1="235" y1="170" x2="365" y2="170"/>
      <line x1="235" y1="265" x2="330" y2="265"/>
    </g>
    <!-- Nœuds -->
    <g fill="#000000" stroke="#1E90FF" stroke-width="8">
      <circle cx="235" cy="170" r="16"/>
      <circle cx="365" cy="170" r="16"/>
      <circle cx="235" cy="265" r="16"/>
      <circle cx="330" cy="265" r="16"/>
      <circle cx="235" cy="410" r="16"/>
    </g>
    <!-- Invite de commande : > _ -->
    <polyline points="290,338 335,374 290,410" fill="none" stroke="#1E90FF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="352" y1="412" x2="402" y2="412" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Pseudo -->
  <text x="300" y="575" text-anchor="middle" font-family="Montserrat, 'Arial Black', Arial, sans-serif" font-weight="800" font-size="50" letter-spacing="2" fill="#FFFFFF">fytia<tspan fill="#1E90FF">olivier</tspan></text>
</svg>
